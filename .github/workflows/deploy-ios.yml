name: Build and Upload to TestFlight

on:
  push:
    branches: [ main ] # Triggers whenever you push to main branch

jobs:
  deploy-ios:
    if: "contains(github.event.head_commit.message, '[deploy]')"
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Apple Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          CERTIFICATE_PATH=$RUNNER_TEMP/build.p12
          printf "%s" "$BUILD_CERTIFICATE_BASE64" | tr -d '\n\r ' | base64 -D -o $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          printf "%s" "$PROVISIONING_PROFILE_BASE64" | tr -d '\n\r ' | base64 -D -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          
          security cms -D -i $PP_PATH > profile.plist
          APPLE_TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" profile.plist)
          PROVISIONING_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" profile.plist)
          
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$PROVISIONING_PROFILE_UUID" ]; then
            echo "Error: Failed to extract Team ID or UUID from the Provisioning Profile. Is the base64 secret correct?"
            exit 1
          fi
          
          echo "Extracted Team ID: $APPLE_TEAM_ID"
          echo "Extracted UUID: $PROVISIONING_PROFILE_UUID"
          
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> $GITHUB_ENV
          echo "PROVISIONING_PROFILE_UUID=$PROVISIONING_PROFILE_UUID" >> $GITHUB_ENV
          
          echo "=== Installed Certificates ==="
          security find-identity -v -p codesigning

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Configure Code Signing
        run: |
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/"iPhone Developer"/"Apple Distribution"/g' ios/Runner.xcodeproj/project.pbxproj
          echo "PROVISIONING_PROFILE_SPECIFIER=$PROVISIONING_PROFILE_UUID" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=Apple Distribution" >> ios/Flutter/Release.xcconfig
          echo "DEVELOPMENT_TEAM=$APPLE_TEAM_ID" >> ios/Flutter/Release.xcconfig

      - name: Generate ExportOptions.plist
        run: |
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.plist">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>uploadSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>app.culturebox.com</key>
                  <string>${PROVISIONING_PROFILE_UUID}</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Build IPA
        run: |
          flutter build ipa --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --export-options-plist=ios/ExportOptions.plist

      - name: Upload Build to App Store Connect / TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf "%s" "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | tr -d '\n\r ' | base64 -D > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: "8856831390:AAGJh7M6MN69CPbtx42t9ngrUUHUqPQlWzY"
          TELEGRAM_CHAT_ID: "@Git_project_notifications_bot"
        run: |
          JOB_STATUS="${{ job.status }}"
          WORKFLOW_NAME="${{ github.workflow }}"
          RUN_NUMBER="${{ github.run_number }}"
          ACTOR="${{ github.actor }}"
          REPO_NAME="${{ github.repository }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          RUN_URL="https://github.com/${REPO_NAME}/actions/runs/${{ github.run_id }}"

          if [ "$JOB_STATUS" = "success" ]; then
            EMOJI="🚀"
            STATUS_TEXT="<b>Build & Upload Successful!</b>"
          else
            EMOJI="❌"
            STATUS_TEXT="<b>Build Failed!</b>"
          fi

          MESSAGE="${EMOJI} <b>App Store / TestFlight Deployment Alert</b>%0A%0A"
          MESSAGE="${MESSAGE}<b>Status:</b> ${STATUS_TEXT}%0A"
          MESSAGE="${MESSAGE}<b>Repository:</b> <code>${REPO_NAME}</code>%0A"
          MESSAGE="${MESSAGE}<b>Triggered By:</b> @${ACTOR}%0A"
          MESSAGE="${MESSAGE}<b>Workflow:</b> ${WORKFLOW_NAME} (#${RUN_NUMBER})%0A"
          MESSAGE="${MESSAGE}<b>Commit:</b> ${COMMIT_MSG}%0A%0A"
          MESSAGE="${MESSAGE}<a href=\"${RUN_URL}\">View GitHub Action Run Logs</a>"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "text=${MESSAGE}" \
            -d "disable_web_page_preview=true"
